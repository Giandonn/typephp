; 由 run.sh 用真实路径/端口渲染后使用（占位符见 run.sh）
[global]
pid = __RUN_DIR__/fpm.pid
error_log = __RUN_DIR__/fpm-error.log
daemonize = no

[www]
listen = 127.0.0.1:__FPM_PORT__
; 非 root 运行：不要设置 user/group，否则 setuid 失败
pm = static
pm.max_children = 4
pm.max_requests = 0
clear_env = no
catch_workers_output = yes

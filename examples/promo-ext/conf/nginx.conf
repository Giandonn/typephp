# 用户态 nginx：由 run.sh 渲染后以 `nginx -c <本文件> -p <prefix>` 启动
worker_processes 1;
error_log __RUN_DIR__/nginx-error.log warn;
pid __RUN_DIR__/nginx.pid;
daemon off;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path __RUN_DIR__/tmp/client_body;
    proxy_temp_path __RUN_DIR__/tmp/proxy;
    fastcgi_temp_path __RUN_DIR__/tmp/fastcgi;
    uwsgi_temp_path __RUN_DIR__/tmp/uwsgi;
    scgi_temp_path __RUN_DIR__/tmp/scgi;

    upstream php_fpm {
        server 127.0.0.1:__FPM_PORT__;
    }

    server {
        listen 127.0.0.1:__NGINX_PORT__;
        server_name _;
        root __DOCROOT__;
        index index.php;

        location / {
            try_files $uri /index.php;
        }

        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }
    }
}
